<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>adicionar</title>
    <link rel="stylesheet" href="static/adicionar.css">
    <script src="static/adicionar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 

</head>
<body>
    <div class="topo">
        <h1 style="color: rgb(255, 255, 255);">Adicionar Itens</h1>
        <img src="./static/ft/novalogo1.png"  class="logo">
    </div>



<br><br>


    <div class="texto">
       <h2>Nome do item:</h2>
    </div>


<form action="/adicionar" method="POST" enctype="multipart/form-data">


    <p style="text-align: center;"><input type="text" id="item" name="item" placeholder="Digite o nome do item"></p>

        <br>
<div class="texto">
    <h2>Descrição:</h2>
</div>

    <p class="caixa" style="text-align: center;"><input type="text" id="descricao" name="descricao" placeholder="Digite a descrição"></p>

<br>
    <div class="texto">
       <h2>Quantidade:</h2>
    </div>
    <p class="caixa" style="text-align: center;"><input type="number" id="quantidade" name="quantidade" placeholder="Digite a quantidade"></p>
    <br>
    <div class="texto">
       <h2>URL da Foto:</h2>
    </div>
     <p class="caixa" style="text-align: center;"><input type="file" id="foto" name="imagem" accept="image/*"  placeholder=" Insira a URL da foto" required></p>
    <br><br>

    <div style="display: flex;justify-content: center ;">
        <button type="submit" id="botao" button class="btn btn-outline-primary">Adicionar</button>
    </div>
    
</form>


    <a href="estoque.html">
        <button id="button" button class="btn btn-outline-primary">⬅</button>
   </a>

</body>
</html>
