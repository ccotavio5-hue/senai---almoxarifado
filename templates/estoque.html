        <form action="/excluirtabela" method="POST">
    <div>

    </form>

    <a id="expo" href="/exportarcsv" button class="btn btn-outline-primary">
    Exportar tabela CSV
    </a>

    <form id="formImportar" action="/importarcsv" method="POST" enctype="multipart/form-data" style="margin: 0;">
            <!-- Input de ficheiro totalmente escondido -->
            <input type="file" id="inputCSV" name="arquivo" accept=".csv" required onchange="this.form.submit()" style="display: none;">

            <button type="button" id="impor" onclick="document.getElementById('inputCSV').click()">
                Importar CSV
            </button>
        </form>

</form>
        <table>
            <tr>
                <th>ID</th>
                <th>ITEM</th>
                <th>DESCRIÇÃO</th>
                <th>QUANTIDADE</th>
                <th>FOTO</th>
                
            </tr>

            {% for produto in produto %}

              <tr>
               <td>{{ produto[0] }}</td>
               <td>{{ produto[1] }}</td>
               <td>{{ produto[2] }}</td>
               <td>{{ produto[3] }}</td>
               <td><button onclick="verImagem('{{ produto[4] }}')"  id="ftn" >📷</button></td>

        </table>
