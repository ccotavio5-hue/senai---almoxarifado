    <main class="container">
        <h1>Assistente IA</h1>
        <p>Tire suas dúvidas sobre ferramentas e materiais.</p>

        <div class="caixa">
            <h2>Faça sua pergunta</h2>

            <div class="pergunta">
                <input type="text" id="perguntaInput"
                    placeholder="Digite sua pergunta..."
                    onkeydown="if(event.key === 'Enter') ia()">

                <button id="but" onclick="ia()">Enviar</button>
            </div>

            <h3>Sugestões de perguntas:</h3>

            <div class="sugestoes">
                <button onclick="perguntar('Para que serve uma parafusadeira?')">
                    Parafusadeira
                </button>

                <button onclick="perguntar('Como armazenar ferramentas corretamente?')">
                    Armazenamento
                </button>

                <button onclick="perguntar('Quais EPIs são obrigatórios no uso de ferramentas?')">
                    Segurança
                </button>

                <button onclick="perguntar('oque é um tijolo e qual sua função?')">
                    Tijolo
                </button>
            </div>

            <h2>Resposta da IA</h2>

            <div id="resultado">
                Olá! Faça uma pergunta para começar.
            </div>
        </div>
